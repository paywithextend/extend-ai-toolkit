name: Publish reviewed toolkit
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: toolkit-release-main
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Select the version from the merged commit
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 1000 --json tagName > /tmp/releases.json
          python - <<'PYTHON'
          import ast, json, os, pathlib, re, subprocess
          version = ast.literal_eval(ast.parse(pathlib.Path('extend_ai_toolkit/__version__.py').read_text()).body[0].value)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version):
              raise SystemExit('Expected a stable semantic version')
          tag = 'v' + version
          released = any(item['tagName'] == tag for item in json.loads(pathlib.Path('/tmp/releases.json').read_text()))
          if not released:
              existing = subprocess.run(['git', 'rev-parse', '--verify', f'refs/tags/{tag}^{{commit}}'], capture_output=True, text=True)
              if existing.returncode == 0 and existing.stdout.strip() != os.environ['GITHUB_SHA']:
                  raise SystemExit('Release tag already points to another commit; do not reuse versions')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'tag={tag}\npublish={str(not released).lower()}\n')
          PYTHON
  build:
    needs: prepare
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install ".[dev,mcp,langchain,openai,terminal-openai,terminal-anthropic]"
      - run: make lint
      - run: make test
      - run: python -m build
      - name: Validate the built wheel and its runtime graph
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          python -m venv /tmp/release-wheel
          /tmp/release-wheel/bin/python -m pip install dist/*.whl
          /tmp/release-wheel/bin/python -I -c "import extend_ai_toolkit as t,os; assert 'v'+t.__version__ == os.environ['RELEASE_TAG']; assert len(t.list_tool_specs()) == 16"
          /tmp/release-wheel/bin/python tools/check_advisories.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolkit-distributions
          path: dist/*
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: toolkit-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true
  release:
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Create the version tag and GitHub release after publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes-file CHANGELOG.md
