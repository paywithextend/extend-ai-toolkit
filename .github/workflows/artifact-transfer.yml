name: Package artifact transfer
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - name: Record package checksums
        working-directory: dist
        run: sha256sum ./*.whl ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: toolkit-transfer-check
          path: dist/*
          if-no-files-found: error
  download:
    needs: upload
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: toolkit-transfer-check
          path: dist
      - name: Verify transferred distributions and install the wheel
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          python -m pip install dist/*.whl
          python -m pip check
          python -I -c "import extend_ai_toolkit as t; assert len(t.list_tool_specs()) == 16"
