[project]
name = "extend_ai_toolkit"
description = "Extend AI Toolkit"
authors = [
    { name = "Extend Engineering", email = "support@paywithextend.com" },
]
dynamic = ["version"]
keywords = ["extend", "api", "virtual cards", "payments", "ai", "agent", "mcp"]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pydantic>=1.10.2",
    "paywithextend==2.0.0",
]

[project.urls]
"Issue Tracker" = "https://github.com/paywithextend/extend-ai-toolkit/issues"
"Source Code" = "https://github.com/paywithextend/extend-ai-toolkit"

[project.optional-dependencies]
langchain = ["langchain==0.3.20"]
mcp = [
    "colorama>=0.4.4",
    "mcp>=1.4.1",
    "mypy==1.15.0",
    "python-dotenv>=1.0.1",
    "starlette>=0.40.0,<0.46.0",
    "uvicorn>=0.27.0",
]
openai = [
    "openai>=1.66.3,<2.0.0",
    "openai-agents==0.0.4",
]
crewai = ["crewai>=0.108.0"]
dev = [
    "build",
    "colorama>=0.4.4",
    "crewai>=0.108.0",
    "langchain==0.3.20",
    "mcp>=1.4.1",
    "mypy>=1.15.0",
    "openai>=1.66.3,<2.0.0",
    "openai-agents==0.0.4",
    "pytest>=7.0.1",
    "pytest-asyncio>=0.26.0",
    "python-dotenv>=1.0.1",
    "ruff>=0.6.1",
    "starlette>=0.40.0,<0.46.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "uvicorn>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "extend_ai_toolkit/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["extend_ai_toolkit"]

[tool.hatch.build]
packages = ["extend_ai_toolkit"]
exclude = ["extend_ai_toolkit/tests/**"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
lint.select = [
    "E", # pycodestyle
    "F", # pyflakes
    "I", # isort
    "D", # pydocstyle
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"extend_ai_toolkit/tests/*" = ["D", "UP", "I002"]
[tool.ruff.lint.pydocstyle]
convention = "google"
