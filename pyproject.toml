[project]
name = "extend_ai_toolkit"
description = "Extend AI Toolkit"
authors = [
    { name = "Extend Engineering", email = "support@paywithextend.com" },
]
dynamic = ["version"]
keywords = ["extend", "api", "virtual cards", "payments", "ai", "agent", "mcp"]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12.5,<3",
    "typing-extensions>=4.15,<5",
    "paywithextend==3.0.0",
]

[project.urls]
"Issue Tracker" = "https://github.com/paywithextend/extend-ai-toolkit/issues"
"Source Code" = "https://github.com/paywithextend/extend-ai-toolkit"

[project.optional-dependencies]
langchain = ["langchain-core>=1.7.3,<2"]
mcp = ["mcp>=2.3.0,<3"]
openai = ["openai-agents>=0.24.0,<0.25"]
crewai = ["crewai>=1.15.33,<2"]
terminal-openai = ["mcp>=2.3.0,<3", "openai>=3.42.0,<4"]
terminal-anthropic = ["mcp>=2.3.0,<3", "anthropic>=2.3.0,<3"]
dev = ["build>=1.6.1,<2", "pytest>=9.2,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.17.3,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "extend_ai_toolkit/__version__.py"

[tool.hatch.build.targets.wheel]
packages = ["extend_ai_toolkit"]

[tool.hatch.build]
packages = ["extend_ai_toolkit"]
exclude = ["extend_ai_toolkit/tests/**"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py311"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "T201"]
[tool.ruff.lint.per-file-ignores]
"tools/*" = ["T201"]
"extend_ai_toolkit/examples/*" = ["T201"]
"extend_ai_toolkit/notebooks/*" = ["T201"]
"extend_ai_toolkit/modelcontextprotocol/client/mcp_client.py" = ["T201"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
